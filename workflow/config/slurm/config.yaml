# Snakemake SLURM profile for a SLURM cluster with BeeGFS.
# Follows site-specific SLURM rules:
#   - no --mem (forbidden by RRZ policy)
#   - all caches on BeeGFS (/home is readonly in batch jobs)
#   - SLURM-PATH must be set before snakemake invocation

executor: slurm

# --- BeeGFS-only paths (placeholders; run scripts fill $USER/$PROJECT) ---
# Users override these via env vars or symlinks before launch.
# directory:                  /beegfs/u/$USER/<group>/<your_dir>/projects/branch
# slurm-logdir:               /beegfs/u/$USER/<group>/<your_dir>/logs/slurm_jobs
# runtime-source-cache-path:  /beegfs/u/$USER/<group>/<your_dir>/.cache/snakemake
# conda-prefix:               /beegfs/u/$USER/<group>/<your_dir>/.snakemake/conda
# apptainer-prefix:           /beegfs/u/$USER/<group>/<your_dir>/containers
# shadow-prefix:              /beegfs/u/$USER/<group>/<your_dir>/projects/branch/.snakemake/shadow
# local-storage-prefix:       /beegfs/u/$USER/<group>/<your_dir>/.snakemake/storage

default-resources:
  slurm_account: your_slurm_account
  slurm_partition: std
  cpus_per_task: 8
  runtime: 240
  mem_mb: 0       # REQUIRED: RRZ rejects any --mem
  disk_mb: 0      # REQUIRED: same rule

# Example GPU-rule overrides. Remove when you actually have a rule.
set-resources: {}
# set-resources:
#   rule_using_gpu:
#     slurm_account: your_gpu_account
#     slurm_partition: gpu
#     gpu: 1
#     tasks_per_gpu: 0    # CRITICAL: without this, plugin sets --ntasks-per-gpu=1 which RRZ rejects
#     cpus_per_gpu: 8

retries: 3
jobs: 50
latency-wait: 120
keep-going: true
use-conda: false
use-apptainer: true
